<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InnerHTML JavaScript</title>
    <style>
      .keranjang {
        background-color: rgb(255, 0, 0);
      }

      .belisekarang {
        background-color: rgb(85, 255, 0);
      }
    </style>
  </head>
  <body>
    <p>Jual T-shirt Murah</p>
    <p>Price: Rp.5000.000.000</p>

    <button
      class="keranjang"
      onclick="
        alert('Tambahkan ke Keranjang');
      "
    >
      Masukan Keranjang
    </button>

    <button
      class="belisekarang"
      onclick="
        alert('Kalem Loading heula...');
        alert('Atos Meser');
      "
    >
      Beli Sekarang
    </button>
  </body>
</html>
