<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraf JavaScript</title>
    
    <!-- Simpan di antara head -->
    <script>
        function myFunction() {
            document.getElementById('demo').innerHTML = 
            "Yeee, Berhasil, ini adalah hasil dari Memasukan JavaScript pada Head. Awas Jangan salah ya? Iya pak.. hehe.";
        }
    </script>
</head>
<body>

    <!-- Simpan di Body -->
    <h2>Paragrafnya harus berubah siap, Sok di klik dlu button nya</h2>
    
    <p id="demo">Nyobaan JavaScript yang disimpan pada HEAD</p>
    
    <button type="button" onclick="myFunction()">Coba Klik</button>

</body>
</html>
