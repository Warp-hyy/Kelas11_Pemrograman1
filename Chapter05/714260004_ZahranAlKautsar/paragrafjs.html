<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function myFunction() {
            document.getElementById("demo").innerHTML = 
            "Yeee, Berhasil,ini adalah hasil dari Memasukan JavaScript pada Head HTML Awas Jangan Salah ya? iya pak. hehe";
        }
    </script>
</head>

<body>
   <h2>Paragraf harus berubah siap, sok di klik dlu nya</h2>
   <p id="demo">Nyobain  JavaScript yang di simpan pada head</p>
   <button type=""button" onclick="myFunction()">Coba klik</button> 
</body>
</html>
