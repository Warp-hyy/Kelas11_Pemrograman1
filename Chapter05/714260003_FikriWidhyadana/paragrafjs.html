<!DOCTYPE html>
<html lang="en">
    <head>
        <script>
            function myFunction() {
                document.getElementById("demo").innerHTML = 
                "Yeeee, Berhasil, ini adalah hasil dari Memasukkan JavaScript pada Head HTML Awas Jangan salah ya? iya pak.. hehe.";
            }
        </script>
    </head>

    <body>
        <h2>Paragrafnya harus berubah siap, Sok di klik dullu button nya</h2>
        <p id="demo">Nyobaan JavaScript yang disimpan pada HEAD</p>
        <button type="button" onclick="myFunction()">Click Klik!</button>
</html>
