<head>
<script>
    function myFunction() {document.getElementById("demo").innerHTML = "Yeee, Berhasil, Ini adalah hasil dari Memasukan JavaScript pada Head HTML Awas jangan salah yaa? iya pak... hehe.";}
</script>
</head>
<body>
    <h2>Paragrafnya harus berubah siap, Sok di klik dlu button nya</h2>
    <p id="demo">Nyoba JavaScript yang di simpan pada head</p>
    <button type="button" onclick="myFunction()">Coba Klik</button>
</body>
